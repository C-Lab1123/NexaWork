<button
  class="password-visibility-toggle"
  type="button"
  aria-controls="{{ field_id }}"
  aria-label="Show password"
  aria-pressed="false"
  title="Show password"
  data-password-toggle
>
  <svg class="password-eye-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
    <circle cx="12" cy="12" r="2.7"></circle>
  </svg>
  <svg class="password-eye-closed" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M3 3l18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.1 0 9.5 6 9.5 6a15 15 0 0 1-3.1 3.6M6.2 6.3C3.8 7.8 2.5 12 2.5 12s3.4 6 9.5 6c1 0 2-.2 2.8-.5"></path>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
  </svg>
</button>
